<!doctype html>
<html lang=en-us dir=ltr>
<head>
  <link rel='stylesheet' href="/assets/css/style.css">
</head>
<body>

<script type="importmap">
{
  "imports": {
    "endap": "/libs/endap/0.0.3/endap.min.js"
  }
}
</script>

<div id="cnt2">
</div>

<script type=module>

import { Console as CLI } from "endap";
import { RandNum as RNU } from "endap";

const consoles = CLI.create("40px");

const cnt = document.getElementById("cnt2");
cnt.append(consoles.el);

const min = 10;
const max = 90
const n = 10;
const x = RNU.randIntN(min, max, n);
consoles.log("x = ", "");
consoles.log(x);

console.log();

for(let i = 0; i < n; i++) {
  for(let j = i+1; j < n; j++) {
    if(x[i] < x[j]) {
      let tmp = x[i];
      x[i] = x[j];
      x[j] = tmp;
    }
  }
}
consoles.log("x = ", "");
consoles.log(x);

</script>

</body>
</html>
